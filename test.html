<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --danger: #f97373;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    main {
      max-width: 1000px;
      width: 100%;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 20px 18px 24px;
    }

    @media (min-width: 768px) {
      main {
        padding: 26px 28px 30px;
      }
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span.logo-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #f9fafb, #38bdf8 35%, #0ea5e9 70%, #0369a1 100%);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .controls label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select {
      background: #020617;
      color: var(--text-main);
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 6px 26px 6px 10px;
      font-size: 0.9rem;
      outline: none;
      appearance: none;
      position: relative;
    }

    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .select-wrapper::after {
      content: "▾";
      position: absolute;
      right: 10px;
      font-size: 0.6rem;
      pointer-events: none;
      color: var(--text-muted);
    }

    .pill {
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .pill span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card-container {
      position: relative;
      margin-bottom: 16px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(56,189,248,0.09), rgba(15,23,42,1));
      border-radius: var(--radius);
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 18px 14px 16px;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .card {
        padding: 22px 20px 20px;
        min-height: 230px;
      }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 0, rgba(56,189,248,0.11), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: var(--text-muted);
    }

    .index {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .question {
      position: relative;
      z-index: 1;
    }

    .question-text {
      font-size: 0.98rem;
      margin-bottom: 8px;
    }

    .options {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
    }

    .option {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.08s ease, background 0.14s ease,
        box-shadow 0.14s ease;
      outline: none;
    }

    .option:hover,
    .option:focus-visible {
      border-color: rgba(56, 189, 248, 0.8);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: rgba(56, 189, 248, 0.7);
    }

    .option.correct {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.8);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.3);
    }

    .option.incorrect {
      background: rgba(249, 115, 115, 0.12);
      border-color: rgba(249, 115, 115, 0.75);
      box-shadow: 0 0 0 1px rgba(249, 115, 115, 0.25);
    }

    .answer-panel {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 0.9rem;
      display: none;
    }

    .answer-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .tf-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-left: 6px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 7px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.6);
      transition: background 0.16s ease, transform 0.08s ease, box-shadow 0.16s ease,
        border-color 0.16s ease;
    }

    button span.icon {
      font-size: 0.8rem;
    }

    button.primary {
      background: linear-gradient(135deg, #0ea5e9, #22c55e);
      border-color: transparent;
      color: #0b1120;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.65);
      border-color: rgba(148, 163, 184, 0.9);
    }

    button.primary:hover {
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.8);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .meta span.dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.7);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .danger {
      color: var(--danger);
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1><span class="logo-dot"></span> Flashcards</h1>
    <p>Use the dropdown to choose a chapter or True/False set, then flip through with the buttons.</p>
  </header>

  <section class="controls">
    <div class="controls-group">
      <label for="deckSelect">Deck:</label>
      <div class="select-wrapper">
        <select id="deckSelect">
          <option value="all">All Questions – MCQ + True/False</option>
          <option value="ch1">Chapter 1 – Privacy & Confidentiality (MCQ)</option>
          <option value="ch2">Chapter 2 – Intellectual Property (MCQ)</option>
          <option value="ch3">Chapter 3 – Cybercrime & Cybersecurity (MCQ)</option>
          <option value="tf">True / False (All Chapters)</option>
          <option id="failedOption" value="failed" disabled>Failed cards (0)</option>
        </select>
      </div>
    </div>
    <div class="controls-group">
      <span class="pill">
        <span class="dot"></span>
        <span id="deckMeta">20 cards · MCQ</span>
      </span>
    </div>
  </section>

  <section class="card-container">
    <div class="card" id="card">
      <div class="card-header">
        <span class="badge" id="badgeText">Chapter 1 · MCQ</span>
        <span class="index" id="indexLabel">1 / 20</span>
      </div>
      <div class="question">
        <div class="question-text" id="questionText">
          <!-- Question text goes here -->
        </div>
        <ul class="options" id="optionsList">
          <!-- Options go here for MCQ -->
        </ul>
        <div class="answer-panel" id="answerPanel">
          <div class="answer-label">Correct Answer</div>
          <div id="answerText"></div>
        </div>
      </div>
      <div class="card-footer">
      <div class="nav-buttons">
        <button id="prevBtn" type="button">
          <span class="icon">◀</span> Prev
        </button>
        <button id="nextBtn" type="button">
          Next <span class="icon">▶</span>
        </button>
        <button id="removeFailedBtn" type="button" title="Remove this card from the failed list">
          <span class="icon">✕</span> Remove from Failed
        </button>
      </div>
      <div class="meta">
        <span id="qTypeMeta">MCQ</span>
        <span class="dot"></span>
        <span id="hintMeta">Tap an option to highlight the correct choice.</span>
        <span class="dot"></span>
        <span id="statsLabel">Correct 0 / 0</span>
      </div>
      </div>
    </div>
    <div class="hint">
      Tip: Use deck switcher to jump between chapters or the True/False set.
    </div>
  </section>
</main>

<script>
  const decks = {
    ch1: {
      label: "Chapter 1 – Privacy & Confidentiality (MCQ)",
      badge: "Chapter 1 · MCQ",
      type: "MCQ",
      cards: [
        {
          q: "Which of the following best defines privacy?",
          options: [
            "A. Duty to protect business information",
            "B. Individual’s right to control their personal information",
            "C. Obligation to protect trade secrets",
            "D. Government right to access information"
          ],
          answer: "B. Individual’s right to control their personal information"
        },
        {
          q: "Confidentiality protects:",
          options: [
            "A. Personal information only",
            "B. The individual",
            "C. Information shared in trust",
            "D. Information already in the public domain"
          ],
          answer: "C. Information shared in trust"
        },
        {
          q: "Which law governs personal information handling in the federal public sector?",
          options: [
            "A. PIPA",
            "B. FIPPA",
            "C. PIPEDA",
            "D. Privacy Act"
          ],
          answer: "D. Privacy Act"
        },
        {
          q: "PIPEDA applies to:",
          options: [
            "A. Federal government institutions only",
            "B. Private-sector organizations engaged in commercial activities",
            "C. Public schools",
            "D. Municipal governments"
          ],
          answer: "B. Private-sector organizations engaged in commercial activities"
        },
        {
          q: "Which is NOT a privacy right under Canadian law?",
          options: [
            "A. Right to access personal information",
            "B. Right to correct personal information",
            "C. Right to delete all organizational data in every circumstance",
            "D. Right to withdraw consent (with limits)"
          ],
          answer: "C. Right to delete all organizational data in every circumstance"
        },
        {
          q: "Confidentiality duties arise from all EXCEPT:",
          options: [
            "A. NDAs",
            "B. Professional codes",
            "C. Implied trust relationships",
            "D. Copyright registration"
          ],
          answer: "D. Copyright registration"
        },
        {
          q: "Which is NOT an example of confidential information?",
          options: [
            "A. Client lists",
            "B. Internal business strategies",
            "C. Public stock prices",
            "D. Algorithms"
          ],
          answer: "C. Public stock prices"
        },
        {
          q: "A trade secret must:",
          options: [
            "A. Be registered with the government",
            "B. Be kept secret and have commercial value",
            "C. Be disclosed annually",
            "D. Expire after 20 years"
          ],
          answer: "B. Be kept secret and have commercial value"
        },
        {
          q: "Which element is required for breach of confidence?",
          options: [
            "A. Information was patented",
            "B. Information was confidential",
            "C. Information was published",
            "D. Information was trademarked"
          ],
          answer: "B. Information was confidential"
        },
        {
          q: "Which is a remedy for breach of confidence?",
          options: [
            "A. Criminal imprisonment in every case",
            "B. Patent invalidation",
            "C. Injunction",
            "D. Forced sale of assets"
          ],
          answer: "C. Injunction"
        },
        {
          q: "Confidential information becomes a trade secret when:",
          options: [
            "A. It is copyrighted",
            "B. It has economic value and secrecy is maintained",
            "C. It is trademarked",
            "D. It is widely distributed"
          ],
          answer: "B. It has economic value and secrecy is maintained"
        },
        {
          q: "Privacy primarily protects:",
          options: [
            "A. Ideas",
            "B. Individuals and their personal information",
            "C. Contracts",
            "D. Logos"
          ],
          answer: "B. Individuals and their personal information"
        },
        {
          q: "Confidentiality is breached when:",
          options: [
            "A. Information is shared with authorization",
            "B. Confidential info is misused or disclosed",
            "C. Information is anonymized",
            "D. Government requests it under law"
          ],
          answer: "B. Confidential info is misused or disclosed"
        },
        {
          q: "Which law governs private-sector privacy in British Columbia?",
          options: [
            "A. PIPEDA",
            "B. FIPPA",
            "C. PIPA",
            "D. Privacy Act"
          ],
          answer: "C. PIPA"
        },
        {
          q: "Employee monitoring requires employers to:",
          options: [
            "A. Provide full anonymity to employees",
            "B. Warn employees through clear policies",
            "C. Avoid monitoring work emails",
            "D. Allow unlimited personal device use at work"
          ],
          answer: "B. Warn employees through clear policies"
        },
        {
          q: "Which is personal information?",
          options: [
            "A. Sales revenue of a company",
            "B. IP address tied to a specific person",
            "C. Company logo",
            "D. Patent number"
          ],
          answer: "B. IP address tied to a specific person"
        },
        {
          q: "The duty of confidentiality primarily protects:",
          options: [
            "A. The data or information itself",
            "B. The person",
            "C. The institution",
            "D. The government"
          ],
          answer: "A. The data or information itself"
        },
        {
          q: "Which organization oversees PIPEDA compliance?",
          options: [
            "A. BC Ombudsperson",
            "B. Office of the Privacy Commissioner of Canada",
            "C. Federal Treasury Board",
            "D. Department of Justice"
          ],
          answer: "B. Office of the Privacy Commissioner of Canada"
        },
        {
          q: "A trade secret lasts:",
          options: [
            "A. 10 years",
            "B. 20 years",
            "C. Until secrecy is lost",
            "D. Until renewal by the government"
          ],
          answer: "C. Until secrecy is lost"
        },
        {
          q: "Which is an example of breach of confidence?",
          options: [
            "A. Sharing public news from a website",
            "B. Disclosing an NDA-protected formula to a competitor",
            "C. Publishing copyright-free art",
            "D. Using a generic business plan template"
          ],
          answer: "B. Disclosing an NDA-protected formula to a competitor"
        }
      ]
    },

    ch2: {
      label: "Chapter 2 – Intellectual Property (MCQ)",
      badge: "Chapter 2 · MCQ",
      type: "MCQ",
      cards: [
        {
          q: "Copyright protects:",
          options: [
            "A. Ideas",
            "B. Functional inventions",
            "C. Expressions fixed in a tangible form",
            "D. Brand names"
          ],
          answer: "C. Expressions fixed in a tangible form"
        },
        {
          q: "Copyright arises:",
          options: [
            "A. After registration with CIPO",
            "B. Only when patented",
            "C. Automatically when work is created",
            "D. Only after the author dies"
          ],
          answer: "C. Automatically when work is created"
        },
        {
          q: "Trademarks protect:",
          options: [
            "A. Mathematical formulas",
            "B. Software algorithms",
            "C. Brand identifiers",
            "D. Manufacturing processes"
          ],
          answer: "C. Brand identifiers"
        },
        {
          q: "Which of the following is patentable?",
          options: [
            "A. Pure ideas",
            "B. Literary works",
            "C. New and useful inventions",
            "D. Personal information"
          ],
          answer: "C. New and useful inventions"
        },
        {
          q: "Trade secrets require:",
          options: [
            "A. Public disclosure",
            "B. Government registration",
            "C. Reasonable secrecy measures",
            "D. Filing with CIPO for approval"
          ],
          answer: "C. Reasonable secrecy measures"
        },
        {
          q: "Patent duration in Canada is:",
          options: [
            "A. Life of the inventor + 70 years",
            "B. 10 years",
            "C. 20 years",
            "D. Unlimited, with renewals"
          ],
          answer: "C. 20 years"
        },
        {
          q: "Trademark protection lasts:",
          options: [
            "A. 20 years, non-renewable",
            "B. 10 years, renewable indefinitely",
            "C. 5 years, non-renewable",
            "D. Life + 70 years"
          ],
          answer: "B. 10 years, renewable indefinitely"
        },
        {
          q: "Copyright does NOT protect:",
          options: [
            "A. Books",
            "B. Software code",
            "C. Ideas",
            "D. Artwork"
          ],
          answer: "C. Ideas"
        },
        {
          q: "Which is a benefit of trademarks?",
          options: [
            "A. Prevent copying of inventions",
            "B. Protect brand reputation and goodwill",
            "C. Replace the need for patents",
            "D. Create trade secrets automatically"
          ],
          answer: "B. Protect brand reputation and goodwill"
        },
        {
          q: "Patent rights include:",
          options: [
            "A. Right to prevent others from using the invention",
            "B. Right to moral attribution only",
            "C. Right to parody the invention",
            "D. No exclusive rights at all"
          ],
          answer: "A. Right to prevent others from using the invention"
        },
        {
          q: "Which is NOT normally trademarkable?",
          options: [
            "A. A purely common surname with no distinctiveness",
            "B. A logo",
            "C. A distinctive product shape",
            "D. A short sound"
          ],
          answer: "A. A purely common surname with no distinctiveness"
        },
        {
          q: "Moral rights include:",
          options: [
            "A. Right to destroy a patent",
            "B. Right to be credited as author and to protect integrity of the work",
            "C. Right to seize trademarks",
            "D. Right to remove trade secrets from contracts"
          ],
          answer: "B. Right to be credited as author and to protect integrity of the work"
        },
        {
          q: "Passing-off protects:",
          options: [
            "A. Patent duration",
            "B. Brand reputation from imitation and confusion",
            "C. Trade secret registration",
            "D. Privacy rights"
          ],
          answer: "B. Brand reputation from imitation and confusion"
        },
        {
          q: "Which best describes a trade secret?",
          options: [
            "A. Patent-protected invention",
            "B. Confidential information with economic value because it is secret",
            "C. Registered industrial design",
            "D. Publicly known formula"
          ],
          answer: "B. Confidential information with economic value because it is secret"
        },
        {
          q: "Which is NOT required for a patent?",
          options: [
            "A. Novelty",
            "B. Non-obviousness",
            "C. Aesthetic design only",
            "D. Utility (usefulness)"
          ],
          answer: "C. Aesthetic design only"
        },
        {
          q: "Copyright duration for individuals in Canada is:",
          options: [
            "A. 10 years",
            "B. 20 years",
            "C. Life of the author + 70 years",
            "D. Life of the author + 50 years (currently)"
          ],
          answer: "C. Life of the author + 70 years"
        },
        {
          q: "Trademarks are primarily used to:",
          options: [
            "A. Protect artistic works",
            "B. Distinguish goods and services in the marketplace",
            "C. Protect chemical formulas",
            "D. Prevent cyberattacks"
          ],
          answer: "B. Distinguish goods and services in the marketplace"
        },
        {
          q: "A trade secret ends when:",
          options: [
            "A. It is used once",
            "B. A lawsuit is filed",
            "C. The information becomes public or loses secrecy",
            "D. A patent on it expires"
          ],
          answer: "C. The information becomes public or loses secrecy"
        },
        {
          q: "What typically protects the appearance (not function) of a product?",
          options: [
            "A. Patent",
            "B. Industrial design registration",
            "C. Copyright only, always",
            "D. Trademark only"
          ],
          answer: "B. Industrial design registration"
        },
        {
          q: "Which protects algorithms best in many cases?",
          options: [
            "A. Patent (if inventive & functional) or trade secret",
            "B. Trademark",
            "C. Copyright without any secrecy",
            "D. Privacy law"
          ],
          answer: "A. Patent (if inventive & functional) or trade secret"
        }
      ]
    },

    ch3: {
      label: "Chapter 3 – Cybercrime & Cybersecurity (MCQ)",
      badge: "Chapter 3 · MCQ",
      type: "MCQ",
      cards: [
        {
          q: "Cybercrime includes crimes where computers are:",
          options: [
            "A. Optional tools",
            "B. Unrelated to the offence",
            "C. Central to the crime",
            "D. Never involved in any way"
          ],
          answer: "C. Central to the crime"
        },
        {
          q: "Technology-as-target includes:",
          options: [
            "A. Email fraud only",
            "B. Investment scams",
            "C. Hacking and DDoS attacks",
            "D. Physical theft of paper files only"
          ],
          answer: "C. Hacking and DDoS attacks"
        },
        {
          q: "Phishing aims to:",
          options: [
            "A. Physically steal hardware",

        },

          ],
          answer: "B. Identity theft and online fraud using computers"
        },

          answer: "D. Trademark registration"
        },
        {

          answer: "B. Human-focused cyber attacks like phishing"
        },
        {

          options: [
            "A. Routine deletion of all files weekly",
            "B. Steps to detect, isolate, and recover from incidents",
            "C. Changing trademarks after every email",
            "D. Annual tax filing procedures"
          ],
          answer: "B. Steps to detect, isolate, and recover from incidents"
        },
        {
          q: "Which behaviour reduces cyber risk?",
          options: [
            "A. Clicking unknown links",
            "B. Avoiding updates",
            "C. Using multi-factor authentication (MFA)",
            "D. Using public Wi-Fi for banking"
          ],
          answer: "C. Using multi-factor authentication (MFA)"
        },
        {
          q: "Ransom should NOT be paid because:",
          options: [
            "A. It is always illegal",
            "B. Decryption is guaranteed by attackers",
            "C. Attackers may not unlock data even after payment",
            "D. Police require ransom not to be paid"
          ],
          answer: "C. Attackers may not unlock data even after payment"
        },
        {
          q: "Cybercrime growth is driven by:",
          options: [
            "A. Decreased internet use",
            "B. Automation, AI, and increased digital connectivity",
            "C. Removal of online services",
            "D. Fewer connected devices"
          ],
          answer: "B. Automation, AI, and increased digital connectivity"
        },
        {
          q: "A privacy breach may occur when:",
          options: [
            "A. A company properly encrypts and protects data",
            "B. Personal information is exposed without authorization",
            "C. A logo is copied",
            "D. A patent expires"
          ],
          answer: "B. Personal information is exposed without authorization"
        }
      ]
    },

    tf: {
      label: "True / False (All Chapters)",
      badge: "True / False · All Chapters",
      type: "TF",
      cards: [
        { q: "Privacy protects individuals, while confidentiality protects information.", answer: "True" },
        { q: "Trade secrets must be registered with the government to be protected.", answer: "False" },
        { q: "Copyright protects ideas themselves.", answer: "False" },
        { q: "Trademarks can protect logos and slogans.", answer: "True" },
        { q: "A patent protects how an invention works.", answer: "True" },
        { q: "A trade secret can last forever if it remains secret.", answer: "True" },
        { q: "Phishing is an example of social engineering.", answer: "True" },
        { q: "Ransomware encrypts data and demands payment.", answer: "True" },
        { q: "PIPEDA applies only to federal government institutions.", answer: "False" },
        { q: "Using strong, unique passwords improves cybersecurity.", answer: "True" },
        { q: "Passing-off can protect unregistered trademarks.", answer: "True" },
        { q: "Confidentiality and privacy mean exactly the same thing.", answer: "False" },
        { q: "A vishing attack uses voice or phone calls to deceive victims.", answer: "True" },
        { q: "Patents generally expire after 20 years in Canada.", answer: "True" },
        { q: "Cybercrime includes identity theft.", answer: "True" },
        { q: "Trademark protection cannot be renewed after it expires.", answer: "False" },
        { q: "Copyright arises automatically when a work is created and fixed.", answer: "True" },
        { q: "A cyber breach involving personal data can also be a privacy breach.", answer: "True" },
        { q: "Trade secrets lose protection when they become public.", answer: "True" },
        { q: "FIPPA governs private-sector businesses across all of Canada.", answer: "False" }
      ]
    }
  };

  const baseDeckKeys = ["ch1", "ch2", "ch3", "tf"];
  const cardLookup = {};

  function tagDeckCards() {
    baseDeckKeys.forEach((key) => {
      const deck = decks[key];
      deck.cards = deck.cards.map((card, idx) => {
        const id = `${key}-${idx}`;
        const typedCard = {
          ...card,
          id,
          type: card.type || deck.type || "MCQ",
          sourceDeck: key
        };
        cardLookup[id] = typedCard;
        return typedCard;
      });
    });
  }

  tagDeckCards();

  const combinedCards = [
    ...decks.ch1.cards.map(card => ({ ...card, type: "MCQ" })),
    ...decks.ch2.cards.map(card => ({ ...card, type: "MCQ" })),
    ...decks.ch3.cards.map(card => ({ ...card, type: "MCQ" })),
    ...decks.tf.cards.map(card => ({ ...card, type: "TF" }))
  ];

  decks.all = {
    label: "All Questions – MCQ + True/False",
    badge: "All Questions · Mixed",
    type: "MIXED",
    cards: combinedCards
  };

  const deckSelect = document.getElementById("deckSelect");
  const failedOption = document.getElementById("failedOption");
  const deckMeta = document.getElementById("deckMeta");
  const badgeText = document.getElementById("badgeText");
  const indexLabel = document.getElementById("indexLabel");
  const questionText = document.getElementById("questionText");
  const optionsList = document.getElementById("optionsList");
  const cardEl = document.getElementById("card");
  const answerPanel = document.getElementById("answerPanel");
  const answerText = document.getElementById("answerText");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const removeFailedBtn = document.getElementById("removeFailedBtn");
  const qTypeMeta = document.getElementById("qTypeMeta");
  const hintMeta = document.getElementById("hintMeta");
  const statsLabel = document.getElementById("statsLabel");

  let currentDeckKey = "all";
  let currentIndex = 0;
  let showAnswer = false;
  let selectedOption = null;
  let hasAnsweredCurrentCard = false;
  const FAILED_STORAGE_KEY = "flashcards_failed_ids_v1";
  const failedCardIds = new Set();
  let touchStartX = null;
  let touchStartY = null;
  const statsByDeck = {};

  deckSelect.value = currentDeckKey;

  function formatDeckType(type) {
    if (type === "MCQ") return "MCQ";
    if (type === "TF") return "True / False";
    return "MCQ + True/False";
  }

  function normalizeText(value) {
    return (value || "").toString().replace(/\s+/g, " ").trim().toLowerCase();
  }

  function getDeckStats(key) {
    if (!statsByDeck[key]) {
      statsByDeck[key] = { correct: 0, total: 0 };
    }
    return statsByDeck[key];
  }

  function updateStatsLabel() {
    const stats = getDeckStats(currentDeckKey);
    if (statsLabel) {
      statsLabel.textContent = `Correct ${stats.correct} / ${stats.total}`;
    }
  }

  function optionsForCard(cardType, card) {
    if (cardType === "MCQ" && Array.isArray(card.options)) return card.options;
    if (cardType === "TF") return ["True", "False"];
    return [];
  }

  function persistFailedDeck() {
    try {
      localStorage.setItem(FAILED_STORAGE_KEY, JSON.stringify([...failedCardIds]));
    } catch (err) {
      // Ignore storage errors (e.g., privacy mode)
    }
  }

  function hydrateFailedDeck() {
    try {
      const raw = localStorage.getItem(FAILED_STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        parsed.forEach((id) => {
          if (cardLookup[id]) failedCardIds.add(id);
        });
      }
    } catch (err) {
      // Ignore malformed storage
    }
  }

  function refreshFailedDeck() {
    const cards = Array.from(failedCardIds)
      .map(id => cardLookup[id])
      .filter(Boolean)
      .map(card => ({ ...card }));

    decks.failed = {
      label: "Failed cards – retry",
      badge: `Failed · ${cards.length} card${cards.length === 1 ? "" : "s"}`,
      type: "MIXED",
      cards
    };

    if (failedOption) {
      failedOption.textContent = `Failed cards (${cards.length})`;
      failedOption.disabled = cards.length === 0;
    }

    if (currentDeckKey === "failed" && cards.length === 0) {
      setDeck("all");
    }

    if (currentDeckKey === "failed") {
      updateDeckMeta();
    }

    persistFailedDeck();
  }

  function recordFailure(card, isCorrect) {
    if (!card || isCorrect) return;
    failedCardIds.add(card.id);
    refreshFailedDeck();
  }

  function handleOptionSelect(optionValue) {
    const deck = decks[currentDeckKey];
    const card = deck.cards[currentIndex];
    const isCorrect = normalizeText(optionValue) === normalizeText(card.answer);

    if (!hasAnsweredCurrentCard) {
      const stats = getDeckStats(currentDeckKey);
      stats.total += 1;
      if (isCorrect) stats.correct += 1;
      updateStatsLabel();
    }

    hasAnsweredCurrentCard = true;
    selectedOption = optionValue;
    showAnswer = true;
    recordFailure(card, isCorrect);
    renderCard();
  }

  function removeCurrentFromFailed() {
    if (currentDeckKey !== "failed") return;
    const deck = decks.failed;
    const card = deck.cards[currentIndex];
    if (!card) return;
    failedCardIds.delete(card.id);
    refreshFailedDeck();

    const remaining = decks.failed.cards.length;
    if (remaining === 0) {
      setDeck("all");
      return;
    }

    currentIndex = Math.min(currentIndex, remaining - 1);
    showAnswer = false;
    selectedOption = null;
    hasAnsweredCurrentCard = false;
    renderCard();
  }

  function updateDeckMeta() {
    const deck = decks[currentDeckKey];
    const total = deck.cards.length;
    const typeLabel = formatDeckType(deck.type);
    deckMeta.textContent = `${total} cards · ${typeLabel}`;
    badgeText.textContent = deck.badge || deck.label || "Flashcards";
  }

  function renderCard() {
    updateStatsLabel();
    const deck = decks[currentDeckKey];
    const card = deck.cards[currentIndex];
    const total = deck.cards.length;

    if (removeFailedBtn) {
      const canRemove = currentDeckKey === "failed" && card && failedCardIds.has(card.id);
      removeFailedBtn.disabled = !canRemove;
      removeFailedBtn.style.opacity = canRemove ? "1" : "0.5";
    }

    if (!card) {
      indexLabel.textContent = `0 / ${total}`;
      questionText.textContent = "No cards to review.";
      optionsList.innerHTML = "";
      optionsList.style.display = "none";
      qTypeMeta.textContent = "—";
      hintMeta.textContent = "Answer incorrectly to add cards to the failed list.";
      answerPanel.style.display = "none";
      answerText.textContent = "";
      return;
    }

    const cardType = card.type || deck.type;
    const isMcq = cardType === "MCQ";
    const options = optionsForCard(cardType, card);
    const hasOptions = options.length > 0;

    indexLabel.textContent = `${currentIndex + 1} / ${total}`;
    questionText.textContent = card.q;

    optionsList.innerHTML = "";
    if (hasOptions) {
      optionsList.style.display = "grid";
      options.forEach(opt => {
        const li = document.createElement("li");
        li.textContent = opt;
        li.className = "option";
        li.tabIndex = 0;

        const isSelected = selectedOption === opt;
        const isCorrect = normalizeText(opt) === normalizeText(card.answer);

        if (isSelected) li.classList.add("selected");
        if (showAnswer && isCorrect) li.classList.add("correct");
        if (showAnswer && isSelected && !isCorrect) li.classList.add("incorrect");

        const triggerSelect = () => handleOptionSelect(opt);
        li.addEventListener("click", triggerSelect);
        li.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            triggerSelect();
          }
        });

        optionsList.appendChild(li);
      });
    } else {
      optionsList.style.display = "none";
    }

    qTypeMeta.textContent = cardType === "TF" ? "True / False" : "MCQ";
    hintMeta.textContent = hasOptions
      ? "Tap an option to highlight the correct choice."
      : "Highlights will show automatically.";

    // Keep the answer panel hidden; highlights on options communicate correctness.
    answerPanel.style.display = "none";
    answerText.textContent = "";
  }

  function setDeck(key) {
    currentDeckKey = key;
    currentIndex = 0;
    showAnswer = false;
    selectedOption = null;
    hasAnsweredCurrentCard = false;
    lastRenderedCardId = null;
    deckSelect.value = key;
    updateDeckMeta();
    updateStatsLabel();
    renderCard();
  }

  deckSelect.addEventListener("change", (e) => {
    setDeck(e.target.value);
  });

  prevBtn.addEventListener("click", () => {
    const deck = decks[currentDeckKey];
    currentIndex = (currentIndex - 1 + deck.cards.length) % deck.cards.length;
    showAnswer = false;
    selectedOption = null;
    hasAnsweredCurrentCard = false;
    renderCard();
  });

  nextBtn.addEventListener("click", () => {
    const deck = decks[currentDeckKey];
    currentIndex = (currentIndex + 1) % deck.cards.length;
    showAnswer = false;
    selectedOption = null;
    hasAnsweredCurrentCard = false;
    renderCard();
  });
  removeFailedBtn.addEventListener("click", removeCurrentFromFailed);

  // Keyboard shortcuts: left/right arrows for navigation
  document.addEventListener("keydown", (e) => {
    if (e.code === "ArrowRight") {
      nextBtn.click();
    } else if (e.code === "ArrowLeft") {
      prevBtn.click();
    }
  });

  // Swipe gestures: swipe left for next, right for previous
  const swipeThreshold = 40;
  cardEl.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }, { passive: true });

  cardEl.addEventListener("touchend", (e) => {
    if (touchStartX === null || touchStartY === null) return;
    if (e.changedTouches.length !== 1) {
      touchStartX = null;
      touchStartY = null;
      return;
    }

    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    touchStartX = null;
    touchStartY = null;

    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    if (absX > absY && absX > swipeThreshold) {
      if (dx < 0) {
        nextBtn.click();
      } else {
        prevBtn.click();
      }
    }
  }, { passive: true });

  // Initialize
  hydrateFailedDeck();
  refreshFailedDeck();
  updateDeckMeta();
  renderCard();
</script>
